<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brood board</title>
<style>
:root{--bg:#f4f5f7;--fg:#1c2128;--mut:#6a737d;--col:#e6e8ec;--card:#fff;--bd:#d0d4da;--acc:#2563eb;--warn:#b45309}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--fg:#e4e7eb;--mut:#8b95a1;--col:#1d2128;--card:#262b33;--bd:#38404a;--acc:#6ea0ff;--warn:#f0b35c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--bd)}
header h1{font-size:15px;margin:0}
select,input,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:4px;padding:4px 8px}
button{cursor:pointer}button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
#q{width:180px}
#msg{margin-left:auto;color:var(--warn)}
#board{flex:1;display:flex;gap:10px;padding:12px;overflow-x:auto}
.col{flex:1 0 220px;max-width:340px;background:var(--col);border-radius:6px;display:flex;flex-direction:column;min-height:0}
.col h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0;padding:8px 10px}
.col.over{outline:2px dashed var(--acc)}
.cards{flex:1;overflow-y:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:5px;padding:7px 9px;cursor:pointer}
.card .t{font-weight:600}.card .m{color:var(--mut);font-size:12px;margin-top:3px}
.card{position:relative}
.card .go{position:absolute;top:4px;right:4px;padding:0 6px;line-height:20px;font-size:12px}
.card .go:disabled{opacity:.45;cursor:not-allowed}
.card .t{padding-right:28px}
.badge{border:1px solid var(--acc);color:var(--acc);border-radius:9px;padding:0 6px;margin-right:3px}
.badge.claimed{background:var(--acc);color:var(--bg);font-weight:600}
#pop{position:absolute;z-index:20;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:4px;display:flex;flex-direction:column;gap:2px;min-width:160px;box-shadow:0 4px 14px #0004}
#pop button{text-align:left;border:0;background:transparent}
#pop button:hover,#pop button:focus-visible{background:var(--col);outline:2px solid var(--acc)}
.go:focus-visible{outline:2px solid var(--acc)}
.badge.await{border-color:var(--warn);color:var(--warn);font-weight:600}
.badge.off{border-color:var(--mut);color:var(--mut)}
#thread{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin:4px 0 6px}
.cm{border:1px solid var(--bd);border-radius:5px;padding:5px 8px;background:var(--card)}
.cm.sess{border-left:3px solid var(--acc)}
.cm .h{color:var(--mut);font-size:12px}.cm .x{white-space:pre-wrap;overflow-wrap:anywhere}
#c-box{height:70px;font-family:inherit}
.tag{border:1px solid var(--bd);border-radius:9px;padding:0 6px;margin-right:3px}
dialog{background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:8px;width:min(640px,94vw)}
dialog::backdrop{background:#0006}
dialog input,dialog textarea{width:100%;margin:4px 0 10px}dialog textarea{height:240px;font-family:ui-monospace,monospace}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <h1>brood board</h1>
  <select id="proj" title="Project"></select>
  <button id="new" class="pri">New card</button>
  <input id="q" type="search" placeholder="Search  /" autocomplete="off" aria-label="Search cards" title="Search cards (/)">
  <span id="msg"></span>
</header>
<div id="board"></div>
<dialog id="dlg">
  <form method="dialog" id="form">
    <label>Title<input id="f-title"></label>
    <label>Description<textarea id="f-body"></textarea></label>
    <label id="l-dec">Decision<textarea id="f-dec" placeholder="Review decision, e.g. approved, merge it"></textarea></label>
    <div class="row">
      <label>Priority <select id="f-prio"><option>low</option><option>normal</option><option>high</option></select></label>
      <label>Tags <input id="f-tags" style="width:200px;margin:0" placeholder="comma separated"></label>
    </div>
    <p class="m" id="f-info" style="color:var(--mut);font-size:12px"></p>
    <div id="cm-sec">
      <div class="m" style="color:var(--mut);font-size:12px">Comments <span id="c-state"></span></div>
      <div id="thread"></div>
      <textarea id="c-box" placeholder="Comment (Ctrl+Enter to post)" style="margin-bottom:4px"></textarea>
      <div class="row" style="margin-bottom:10px"><button type="button" id="c-post">Comment</button><span id="c-hint" style="color:var(--mut);font-size:12px"></span></div>
    </div>
    <div class="row">
      <button type="button" id="save" class="pri">Save</button>
      <button type="button" id="cancel">Close</button>
      <span style="flex:1"></span>
      <select id="f-sess"></select>
      <button type="button" id="send">Send to session</button>
    </div>
  </form>
</dialog>
<script>
"use strict";
const token = new URLSearchParams(location.search).get("token") || "";
const $ = id => document.getElementById(id);
let projects = [], columns = [], cards = [], project = localStorage.getItem("brood-project") || "", editing = null;
const sentTo = new Map();
let query = "";
function matches(c) {
  const q = query.trim().toLowerCase();
  if (!q) return true;
  return [c.title, c.id, (c.tags || []).join(" "), c.owner, c.body, c.decision].some(v => v && String(v).toLowerCase().includes(q));
}
const NO_SEND = ["done"]; // work is finished there: nothing to send

async function api(method, path, body) {
  const r = await fetch(path, {method, headers: token ? {"X-Brood-Token": token, "Content-Type": "application/json"} : {"Content-Type": "application/json"}, body: body ? JSON.stringify(body) : undefined});
  let data = null; try { data = await r.json(); } catch (e) {}
  return {status: r.status, data};
}
let msgTimer;
function note(t) { $("msg").textContent = t; clearTimeout(msgTimer); msgTimer = setTimeout(() => $("msg").textContent = "", 5000); }

async function loadProjects() {
  const r = await api("GET", "/api/projects");
  if (r.status !== 200) { note("auth failed: open the URL from `brood board --url`"); return; }
  projects = r.data.projects; columns = r.data.columns;
  if (!projects.find(p => p.id === project)) {
    const live = projects.find(p => p.sessions > 0) || projects[0];
    project = live ? live.id : "";
  }
  $("proj").innerHTML = projects.map(p => `<option value="${p.id}">${esc(p.name)} (${p.sessions})</option>`).join("");
  $("proj").value = project;
  await loadCards();
}
async function loadCards() {
  if (!project) { cards = []; render(); return; }
  const r = await api("GET", `/api/projects/${project}/cards`);
  if (r.status === 200) { cards = r.data.cards; columns = r.data.columns; }
  render();
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function render() {
  $("board").innerHTML = "";
  for (const col of columns) {
    const el = document.createElement("section"); el.className = "col";
    const all = cards.filter(c => c.column === col);
    const list = all.filter(matches);
    el.innerHTML = `<h2>${esc(col)} (${query.trim() ? list.length + "/" + all.length : list.length})</h2><div class="cards"></div>`;
    const box = el.querySelector(".cards");
    for (const c of list) {
      const d = document.createElement("div"); d.className = "card"; d.draggable = true;
      d.innerHTML = `<div class="t">${esc(c.title)}</div><div class="m">${c.column === "review" && c.decision ? `<span class="badge" title="has a review decision">decision</span>` : ""}${c.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}${c.priority !== "normal" ? esc(c.priority) + " " : ""}${c.awaiting_user ? `<span class="badge await" title="a session is waiting for your answer">awaiting you</span>` : ""}${c.owner && c.owner_state === "offline" ? `<span class="badge off" title="the claiming session is gone">owner offline</span>` : ""}${c.comments && c.comments.length ? `<span class="tag" title="comments">${c.comments.length} &#9993;</span>` : ""}${c.owner ? `<span class="badge claimed" title="claimed by session ${esc(c.owner)}">claimed ${esc(c.owner.slice(0, 8))}</span>` : sentTo.has(c.id) ? `<span class="badge">sent ${esc(sentTo.get(c.id))}</span>` : ""}</div>${NO_SEND.includes(c.column) ? "" : `<button type="button" class="go" draggable="false" aria-label="Send to session" title="Send to session">&#10148;</button>`}`;
      const go = d.querySelector(".go");
      if (go) {
      const pj = projects.find(x => x.id === project);
      if (pj && pj.sessions === 0) { go.disabled = true; go.title = "no live session"; }
      go.onmousedown = e => e.stopPropagation();
      go.ondragstart = e => { e.preventDefault(); e.stopPropagation(); };
      go.onclick = e => { e.stopPropagation(); e.preventDefault(); openPop(go, c); };
      go.onkeydown = e => e.stopPropagation();
      }
      if (c.owner) sentTo.delete(c.id);
      d.ondragstart = e => e.dataTransfer.setData("text/plain", c.id);
      d.onclick = () => openCard(c);
      box.appendChild(d);
    }
    el.ondragover = e => { e.preventDefault(); el.classList.add("over"); };
    el.ondragleave = () => el.classList.remove("over");
    el.ondrop = async e => {
      e.preventDefault(); el.classList.remove("over");
      const c = cards.find(x => x.id === e.dataTransfer.getData("text/plain"));
      if (!c || c.column === col) return;
      const r = await api("POST", `/api/projects/${project}/cards/${c.id}/move`, {rev: c.rev, ver: c.ver, column: col});
      if (r.status === 409) note("changed elsewhere, reloaded");
      else if (r.status !== 200) note(r.data && r.data.error || "move failed");
      await loadCards();
    };
    $("board").appendChild(el);
  }
}

async function liveSessions() {
  const s = await api("GET", `/api/projects/${project}/sessions`);
  return s.status === 200 ? s.data.sessions : [];
}
async function sendCard(cardId, session) {
  const r = await api("POST", `/api/projects/${project}/cards/${cardId}/send`, {session});
  const ok = r.status === 200;
  note(ok ? "queued for session " + session.slice(0, 8) : (r.data && r.data.error || "send failed"));
  if (ok) { sentTo.set(cardId, session.slice(0, 8)); render(); }
  return ok;
}
function closePop() { const p = $("pop"); if (p) { const b = p._btn; p.remove(); if (b && b.isConnected) b.focus(); } }
async function openPop(btn, c) {
  const had = $("pop") && $("pop")._btn === btn; closePop(); if (had) return;
  const list = await liveSessions();
  if (!list.length) { btn.disabled = true; btn.title = "no live session"; note("no live session"); return; }
  const p = document.createElement("div"); p.id = "pop"; p.setAttribute("role", "menu"); p._btn = btn;
  p.innerHTML = list.map(x => `<button type="button" role="menuitem" data-s="${esc(x.session)}">${esc(x.session.slice(0, 8))} ${esc(x.cwd.split(/[\\/]/).pop())}</button>`).join("");
  const r = btn.getBoundingClientRect();
  p.style.top = (r.bottom + window.scrollY + 2) + "px"; p.style.left = Math.max(4, r.right + window.scrollX - 170) + "px";
  p.onclick = async e => { const b = e.target.closest("button"); if (!b) return; e.stopPropagation(); const id = b.dataset.s; closePop(); await sendCard(c.id, id); };
  p.onkeydown = e => {
    const items = [...p.querySelectorAll("button")], i = items.indexOf(document.activeElement);
    if (e.key === "Escape") { e.preventDefault(); closePop(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
  };
  document.body.appendChild(p); p.querySelector("button").focus();
}
document.addEventListener("click", e => { if ($("pop") && !e.target.closest("#pop,.go")) closePop(); });

async function openCard(c) {
  editing = c;
  $("f-title").value = c.title; $("f-body").value = c.body; $("f-prio").value = c.priority; $("f-tags").value = c.tags.join(", ");
  $("f-dec").value = c.decision || ""; $("f-dec").readOnly = c.column !== "review";
  $("l-dec").style.display = c.column === "review" || c.decision ? "" : "none";
  $("f-info").textContent = `${c.id}  rev ${c.rev}  updated ${c.updated}` + (c.owner ? `  claimed by ${c.owner.slice(0, 8)}` : "");
  $("send").style.display = $("f-sess").style.display = NO_SEND.includes(c.column) ? "none" : "";
  const list = await liveSessions();
  $("f-sess").innerHTML = list.length ? list.map(x => `<option value="${esc(x.session)}">${esc(x.session.slice(0, 8))} ${esc(x.cwd.split(/[\\/]/).pop())}</option>`).join("") : `<option value="">no live sessions</option>`;
  showThread(c);
  $("c-box").value = "";
  $("dlg").showModal();
}
function showThread(c) {
  $("cm-sec").style.display = "";
  $("thread").innerHTML = (c.comments || []).map(m => `<div class="cm${m.author === "user" ? "" : " sess"}"><div class="h">${esc(m.author === "user" ? "you" : m.author)} &middot; ${esc(m.at)}${m.awaiting ? " &middot; awaiting you" : ""}</div><div class="x">${esc(m.text)}</div></div>`).join("") || `<div class="h" style="color:var(--mut)">No comments yet.</div>`;
  $("thread").scrollTop = $("thread").scrollHeight;
  const st = c.owner_state || (c.owner ? "live" : "unclaimed");
  $("c-state").textContent = c.awaiting_user ? "(awaiting you)" : "";
  $("c-hint").textContent = st === "live" ? "Delivered to the claiming session." : st === "offline"
    ? "Owner offline: delivered when the card is next sent or claimed." : "Unclaimed: delivered when the card is next sent or claimed.";
}
$("c-post").onclick = async () => {
  const text = $("c-box").value;
  if (!editing || !text.trim()) return;
  const r = await api("POST", `/api/projects/${project}/cards/${editing.id}/comment`, {text});
  if (r.status >= 400) { note(r.data && r.data.error || "comment failed"); return; }
  // A comment changes neither rev nor ver: keep the form's view and take only the thread.
  editing = {...editing, comments: r.data.comments, awaiting_user: r.data.awaiting_user, owner_state: r.data.owner_state};
  $("c-box").value = ""; showThread(editing);
  note(r.data.delivered ? "comment delivered to the session" : "comment saved");
};
$("c-box").onkeydown = e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $("c-post").onclick(); } };
$("new").onclick = () => {
  editing = null;
  $("f-title").value = ""; $("f-body").value = ""; $("f-dec").value = ""; $("l-dec").style.display = "none"; $("f-prio").value = "normal"; $("f-tags").value = "";
  $("f-info").textContent = "New card in " + columns[0];
  $("send").style.display = $("f-sess").style.display = "none";
  $("cm-sec").style.display = "none";
  $("dlg").showModal();
};
$("cancel").onclick = () => $("dlg").close();
$("save").onclick = async () => {
  const body = {title: $("f-title").value, body: $("f-body").value, priority: $("f-prio").value,
    tags: $("f-tags").value.split(",").map(t => t.trim()).filter(Boolean)};
  if (!body.title.trim()) { note("title required"); return; }
  let r;
  if (editing && editing.column === "review") body.decision = $("f-dec").value;
  if (editing) r = await api("PATCH", `/api/projects/${project}/cards/${editing.id}`, {...body, rev: editing.rev, ver: editing.ver});
  else r = await api("POST", `/api/projects/${project}/cards`, body);
  if (r.status === 409) note("changed elsewhere, reloaded");
  else if (r.status >= 400) { note(r.data && r.data.error || "save failed"); return; }
  $("dlg").close(); await loadCards();
};
$("send").onclick = async () => {
  const session = $("f-sess").value;
  if (!session || !editing) { note("no session to send to"); return; }
  const body = {title: $("f-title").value, body: $("f-body").value, priority: $("f-prio").value,
    tags: $("f-tags").value.split(",").map(t => t.trim()).filter(Boolean)};
  if (editing.column === "review") body.decision = $("f-dec").value;
  const same = body.title === editing.title && body.body === editing.body && body.priority === editing.priority &&
    body.tags.join("\n") === editing.tags.join("\n") && (body.decision === undefined || body.decision === (editing.decision || ""));
  if (!same) {
    if (!body.title.trim()) { note("title required"); return; }
    const r = await api("PATCH", `/api/projects/${project}/cards/${editing.id}`, {...body, rev: editing.rev, ver: editing.ver});
    if (r.status === 409) { note("changed elsewhere, reloaded"); $("dlg").close(); await loadCards(); return; }
    if (r.status >= 400) { note(r.data && r.data.error || "save failed"); return; }
    editing = r.data;
  }
  if (await sendCard(editing.id, session)) { $("dlg").close(); await loadCards(); }
};
$("proj").onchange = () => { project = $("proj").value; localStorage.setItem("brood-project", project); loadCards(); };

function listen() {
  const es = new EventSource(token ? "/api/events?token=" + encodeURIComponent(token) : "/api/events");
  es.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (ev.type === "cards" && ev.project === project && !$("dlg").open) loadCards();
    else if (ev.type !== "cards") loadProjects();
  };
}
$("q").oninput = () => { query = $("q").value; render(); };
$("q").onkeydown = e => { if (e.key === "Escape") { e.preventDefault(); $("q").value = ""; query = ""; $("q").blur(); render(); } };
document.addEventListener("keydown", e => {
  if (e.key !== "/" || e.ctrlKey || e.metaKey || e.altKey || e.defaultPrevented) return;
  const a = document.activeElement;
  if (a && (/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) || a.isContentEditable)) return;
  if ($("dlg").open) return;
  e.preventDefault(); $("q").focus(); $("q").select();
});
loadProjects(); listen();
</script>
</body>
</html>
