[package]
name = "brood-cc"
version = "0.0.9"
edition = "2024"
description = "Claude Code plugin helper: coordinator mode, subagent process cleanup, loop and prompt-injection guards"
license = "MIT"
repository = "https://github.com/others-git/brood"
readme = "README.md"

[[bin]]
name = "brood"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
hmac = "0.12"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sysinfo = "0.40.1"
toml = "1.1.8"

[profile.release]
lto = true
strip = true
codegen-units = 1
